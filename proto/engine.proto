syntax = "proto3";

package engine.v1;

option go_package = "github.com/MC-161/liftstore/gen/engine/v1;enginev1";

service Engine {
    rpc TopLifters (TopLiftersRequest) returns (TopLiftersResponse);
    rpc Percentile (PercentileRequest) returns (PercentileResponse);
    rpc ConditionalPercentile (ConditionalPercentileRequest) returns (ConditionalPercentileResponse);
    rpc Distribution   (DistributionRequest)   returns (DistributionResponse);
    rpc ClassSweep     (ClassSweepRequest)     returns (ClassSweepResponse);
    rpc ClassTrend     (ClassTrendRequest)     returns (ClassTrendResponse);
    rpc EquipmentSwap  (EquipmentSwapRequest)  returns (EquipmentSwapResponse);
    rpc ClassChange    (ClassChangeRequest)    returns (ClassChangeResponse);
    rpc Attempts       (AttemptsRequest)       returns (AttemptsResponse);
    rpc ValueAtPercentile (ValueAtPercentileRequest) returns (ValueAtPercentileResponse);
    rpc DatasetStats   (DatasetStatsRequest)   returns (DatasetStatsResponse);
    rpc Leaderboard    (LeaderboardRequest)    returns (LeaderboardResponse);
    rpc LifterByName   (LifterByNameRequest)   returns (LifterByNameResponse);
}

enum Sex {
    SEX_UNSPECIFIED = 0;    // enum values need numbers too, and 0 must exist
    SEX_M = 1;
    SEX_F =  2;
    SEX_MX = 3;
}

enum Equipment {
    EQUIPMENT_UNSPECIFIED = 0;
    EQUIPMENT_RAW = 1;
    EQUIPMENT_WRAPS = 2;
    EQUIPMENT_SINGLE_PLY = 3;
    EQUIPMENT_MULTI_PLY = 4;
    EQUIPMENT_UNLIMITED = 5;
    EQUIPMENT_STRAPS = 6;
}

enum Event {
    EVENT_UNSPECIFIED = 0;
    EVENT_SBD = 1;
    EVENT_B = 2;
    EVENT_D = 3;
    EVENT_BD = 4;
    EVENT_S = 5;
    EVENT_SB = 6;
    EVENT_SD = 7;
}

message TopLiftersRequest {
    Sex sex = 1;
    Equipment equipment = 2;
    Event event = 3;
    uint32 limit = 4;
}
message LifterResult {
    string name = 1;
    float total = 2;
    string date = 3;
    string federation =4;
    string meet = 5;

}
message TopLiftersResponse {
    repeated LifterResult results = 1;  // repeated = list
}


message PercentileRequest{
    Sex sex = 1;
    Equipment equipment = 2;
    Event event = 3;
    float bodyweight = 4;
    float value = 5;
    LiftKind lift = 6;
}

message Neighbour {
    string name  = 1;
    float  value = 2;
}

message PercentileResponse {
    double percentile   = 1;
    uint32 below        = 2;
    uint32 rank         = 3;
    uint32 n            = 4;
    string weight_class = 5;
    repeated Neighbour neighbours = 6;
}




enum LiftKind {
    LIFT_KIND_UNSPECIFIED = 0;
    LIFT_KIND_SQUAT       = 1;
    LIFT_KIND_BENCH       = 2;
    LIFT_KIND_DEADLIFT    = 3;
    LIFT_KIND_TOTAL       = 4;
}

message ConditionalPercentileRequest {
    Sex       sex             = 1;
    Equipment equipment       = 2;
    Event     event           = 3;
    LiftKind  condition_lift  = 4;
    float     condition_value = 5;
    LiftKind  target_lift     = 6;
    float     target_value    = 7;
    // Set: compare within this class, falling back to all classes if it holds
    // too few results. Unset: all classes (the original Q2).
    optional uint32 ipf_class = 8;
}

message ConditionalPercentileResponse {
    double percentile = 1;
    uint32 below      = 2;
    uint32 n          = 3;
    float  tol_used   = 4;
    float  target_median = 5;     // median target lift across the n results
    bool   all_classes   = 6;     // the group spans every class (none asked, or fell back)
    repeated Bin target_bins = 7; // target lift across the n results, 5 kg bins
}


// ---------- shared ----------

message GroupKey {
    Sex       sex       = 1;
    Equipment equipment = 2;
    Event     event     = 3;
    uint32    ipf_class = 4;      // the INDEX, not the kg label
}

message GroupSummary {
    GroupKey key          = 1;
    string   weight_class = 2;    // the label, e.g. "63"
    uint32   n            = 3;    // 0 is a valid, returned answer
    float    mean         = 4;
    float    sd           = 5;
}

message Bin {
    float  low       = 1;         // [low, high)  -- half-open, everywhere
    float  high      = 2;
    uint32 count     = 3;
    uint32 successes = 4;         // Attempts only: how many of `count` made it
}

message SigmaMark {
    int32 k        = 1;           // -2, -1, 0, +1, +2
    float value    = 2;           // mean + k*sd
    bool  in_range = 3;           // false when it falls outside [min, max]
}

// ---------- Q4 ----------

message DistributionRequest {
    GroupKey key       = 1;
    LiftKind lift      = 2;
    float    bin_width = 3;       // 0 => server default
}

message DistributionResponse {
    GroupSummary       summary     = 1;
    repeated Bin       bins        = 2;
    repeated SigmaMark sigma_marks = 3;
    float              min         = 4;
    float              max         = 5;
    float              bin_width   = 6;   // what the server actually used
}

// ---------- Q6 ----------

message ClassSweepRequest {
    Sex       sex       = 1;
    Equipment equipment = 2;
    Event     event     = 3;
    LiftKind  lift      = 4;
    float     value     = 5;      // 0 => no percentile column
}

message ClassSweepRow {
    GroupSummary summary        = 1;
    double        percentile     = 2;
    bool         has_percentile = 3;
}

message ClassSweepResponse {
    repeated ClassSweepRow rows = 1;
}

// ---------- Q11 ----------

message ClassTrendRequest {
    GroupKey key        = 1;
    LiftKind lift       = 2;
    uint32   start_year = 3;
    uint32   end_year   = 4;
}

message ClassTrendRow {
    uint32 year = 1;
    uint32 n    = 2;
    float  mean = 3;
    float  sd   = 4;
    float  p50  = 5;
    float  p90  = 6;
}

message ClassTrendResponse {
    repeated ClassTrendRow rows = 1;
}

// ---------- Q10 ----------

message EquipmentSwapRequest {
    Sex       sex       = 1;
    Event     event     = 2;
    Equipment from_equipment      = 3;
    Equipment to_equipment        = 4;
    LiftKind  lift      = 5;
    uint32    ipf_class = 6;
}

message EquipmentSwapResponse {
    uint32       lifters      = 1;   // distinct lifters with results in BOTH
    float        mean_delta   = 2;
    float        sd_delta     = 3;
    float        median_delta = 4;
    GroupSummary from_summary = 5;
    GroupSummary to_summary   = 6;
}

// ---------- Q7 ----------

message ClassChangeRequest {
    Sex       sex         = 1;
    Equipment equipment   = 2;
    Event     event       = 3;
    int32     class_delta = 4;       // +1 moved up one class, -1 down
}

message ClassChangeResponse {
    uint32       lifters          = 1;   // DISTINCT lifters contributing
    float        mean_total_delta = 2;
    float        sd_total_delta   = 3;
    uint32       improved         = 4;
    repeated Bin delta_bins       = 5;
    uint32       transitions      = 6;   // observations; always >= lifters
    float        median_bw_delta  = 7;   // kg of bodyweight, signed
    float        median_total_per_bw_kg = 8;   // median of total delta / bw delta
    uint32       bw_transitions   = 9;   // transitions with |bw delta| >= 1 kg
}

// ---------- Q8 ----------

message AttemptsRequest {
    GroupKey key  = 1;
    LiftKind lift = 2;
}

message AttemptsResponse {
    uint32       n                     = 1;   // rows with BOTH attempts present
    uint32       third_attempt_success = 2;
    float        success_rate          = 3;
    float        mean_jump             = 4;   // attempt3 - attempt2, kg
    float        sd_jump               = 5;
    repeated Bin jump_bins             = 6;
}

// ---------- Q3 ----------

message ValueAtPercentileRequest {
    Sex       sex        = 1;
    Equipment equipment  = 2;
    Event     event      = 3;
    float     bodyweight = 4;
    LiftKind  lift       = 5;
    double    percentile = 6;     // (0, 100]; 0 is "unset", so it is rejected
}

message ValueAtPercentileResponse {
    float  value             = 1;   // a weight somebody actually lifted
    double actual_percentile = 2;   // percentile of `value`; <= requested, see below
    uint32 n                 = 3;   // 0 is a valid answer: value is then 0
    string weight_class      = 4;
}

// ---------- Q9 ----------

message DatasetStatsRequest {
    // All optional, unlike everywhere else: UNSPECIFIED means "any".
    Sex       sex       = 1;
    Equipment equipment = 2;
    Event     event     = 3;
}

message DatasetStatsResponse {
    uint32 results     = 1;   // placed rows with a total: the population queries rank
    uint32 federations = 2;   // distinct federations among those rows
}

// ---------- Leaderboards ----------

enum Metric {
    METRIC_UNSPECIFIED = 0;
    METRIC_KG          = 1;
    METRIC_PERCENTILE  = 2;
}

enum Combine {
    COMBINE_NONE  = 0;          // score = a; the zero value is a real choice here
    COMBINE_MINUS = 1;
    COMBINE_PLUS  = 2;
    COMBINE_RATIO = 3;
}

enum RankPreset {
    RANK_PRESET_UNSPECIFIED = 0;
    RANK_PRESET_TOP_TOTAL   = 1;
    RANK_PRESET_DOTS        = 2;
    RANK_PRESET_BALANCED    = 3;  // smallest spread of the three lift percentiles
    RANK_PRESET_CUSTOM      = 4;  // a [combine b], ordered by `ascending`
}

message Operand {
    LiftKind lift   = 1;
    Metric   metric = 2;
}

message LeaderboardRequest {
    GroupKey   key       = 1;
    RankPreset preset    = 2;
    Operand    a         = 3;
    Combine    combine   = 4;
    Operand    b         = 5;
    bool       ascending = 6;
    uint32     limit     = 7;     // 0 => 10; max 100
    // "Where would you rank": all four set, or none.
    float      you_squat      = 8;
    float      you_bench      = 9;
    float      you_deadlift   = 10;
    float      you_bodyweight = 11;
    // Off by default = filter ON: lines where one lift is under 15% of the
    // total are dropped and counted in `hidden`.
    bool       include_implausible = 12;
}

message LeaderRow {
    uint32 rank         = 1;
    string name         = 2;
    float  squat        = 3;
    float  bench        = 4;
    float  deadlift     = 5;
    float  total        = 6;
    float  bodyweight   = 7;
    float  dots         = 8;
    double squat_pct    = 9;
    double bench_pct    = 10;
    double deadlift_pct = 11;
    double total_pct    = 12;
    double score        = 13;
    string date         = 14;
    string federation   = 15;
}

message LeaderboardResponse {
    uint32             lifters  = 1;  // lifters ranked (complete S/B/D in the class)
    repeated LeaderRow rows     = 2;
    reserved 3;                       // was has_you: clashes with C++'s generated has_you()
    LeaderRow          you      = 4;  // set only when you_* were sent; rank = where you'd place
    string             weight_class = 5;
    uint32             hidden   = 6;  // lifters dropped as implausible (0 when included)
}

// ---------- Head to Head ----------

message LifterByNameRequest {
    string    name      = 1;      // exact, as the dataset spells it
    Sex       sex       = 2;
    Equipment equipment = 3;
    Event     event     = 4;
    optional uint32 ipf_class = 5;  // set: best result IN this class; unset: any class
}

message LifterByNameResponse {
    string name         = 1;
    float  squat        = 2;
    float  bench        = 3;
    float  deadlift     = 4;
    float  total        = 5;
    float  bodyweight   = 6;
    float  dots         = 7;
    string date         = 8;
    string federation   = 9;
    string meet         = 10;
    string weight_class = 11;     // the class of THAT result
    uint32 results      = 12;     // their placed results in the category
}
